services:
  - type: web
    name: skeddy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /api/healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: VAULT_TOKEN
        sync: false
      - key: VAULT_CHAT_ID
        sync: false
      - key: SECRET_PHRASE
        value: haydenando
      - key: DEFAULT_TIMEZONE
        value: UTC
      - key: MINI_APP_URL
        sync: false
