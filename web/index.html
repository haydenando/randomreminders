<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Randomly Remind Me</title>
<style>
  :root {
    --tg-bg: var(--tg-theme-bg-color, #0b0b12);
    --tg-panel: var(--tg-theme-secondary-bg-color, #171822);
    --tg-text: var(--tg-theme-text-color, #f3f3f9);
    --tg-hint: var(--tg-theme-hint-color, #a2a3b6);
    --tg-link: var(--tg-theme-link-color, #8a4dff);
    --tg-button: var(--tg-theme-button-color, #8a4dff);
    --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
    --accent: #8a4dff;
    --accent-2: #4a6cf7;
    --gold: #ffd23f;
    --accent-grad: linear-gradient(135deg, #9d4dff, #4a6cf7);
    --danger: #ff5d5d;
    --ok: #34c759;
    --radius: 18px;
    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.10);
    --maxw: 540px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { background:
      radial-gradient(1200px 900px at 15% -10%, rgba(138,77,255,.20), transparent 60%),
      radial-gradient(1100px 800px at 115% 15%, rgba(74,108,247,.16), transparent 55%),
      radial-gradient(800px 600px at 50% 115%, rgba(255,210,63,.06), transparent 60%),
      var(--tg-bg);
    color: var(--tg-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; }
  #app { width: 100%; max-width: var(--maxw); min-height: 100vh;
    display: flex; flex-direction: column; }

  /* Glass helpers */
  .glass { background: var(--glass); backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--glass-border); }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; position: sticky; top: 0; z-index: 10;
    background: rgba(14,15,19,.55); backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--glass-border); }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .logo { width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--tg-button-text); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; box-shadow: 0 4px 18px rgba(138,77,255,.45); }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .icon-btn { background: transparent; border: 0; color: var(--tg-hint); font-size: 21px;
    padding: 8px; border-radius: 12px; cursor: pointer; transition: background .15s ease; }
  .icon-btn:active { background: var(--glass); }
  .hdr-actions { display: flex; gap: 2px; }

  main { flex: 1; overflow-y: auto; padding: 4px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }

  /* Segmented control */
  .seg { display: flex; background: var(--glass); backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 5px; gap: 4px; }
  .seg button { flex: 1; background: transparent; border: 0; color: var(--tg-hint);
    padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .16s ease; }
  .seg button.active { background: var(--accent); color: var(--tg-button-text);
    box-shadow: 0 4px 18px rgba(138,77,255,.45); }
  .tabs { display: flex; background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 5px; margin: 4px 0 14px; gap: 4px; }
  .tabs button { flex: 1; background: transparent; border: 0; color: var(--tg-hint);
    padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .16s ease; }
  .tabs button.active { background: var(--accent); color: var(--tg-button-text); }

  .empty { border: 1.5px dashed var(--glass-border); border-radius: var(--radius); padding: 30px 16px;
    color: var(--tg-hint); font-size: 14px; text-align: center; margin: 32px 8px; line-height: 1.6; }
  .empty .big { font-size: 38px; display: block; margin-bottom: 10px; }

  .skeleton { height: 90px; border-radius: var(--radius); background: var(--glass);
    margin-bottom: 12px; opacity: .6; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .card { background: var(--glass); backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--glass-border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card .top { display: flex; align-items: flex-start; gap: 12px; }
  .card .chip { flex: 0 0 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(52,183,161,.28), rgba(79,140,255,.28));
    display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-size: 15px; font-weight: 700; line-height: 1.35; word-wrap: break-word; }
  .card .meta { font-size: 12.5px; color: var(--tg-hint); margin-top: 6px; line-height: 1.5; }
  .card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
    background: rgba(52,183,161,.16); color: var(--accent); text-transform: uppercase; letter-spacing: .4px; }
  .badge.muted { background: var(--glass); color: var(--tg-hint); }
  .card .sched-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sched-pill { font-size: 11.5px; color: var(--tg-hint); background: var(--glass-strong);
    border-radius: 8px; padding: 5px 9px; }
  .card .note { font-size: 12.5px; color: var(--tg-hint); margin-top: 8px;
    padding: 9px 11px; background: var(--glass); border-radius: 11px; }
  .tag-holder { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag-chip { font-size: 11.5px; color: var(--tg-text); background: rgba(79,140,255,.18);
    padding: 4px 9px; border-radius: 8px; }
  .card .actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--glass-border); align-items: center; flex-wrap: wrap; }
  .card .actions .spacer { flex: 1; }
  .card .actions button { background: transparent; border: 0; color: var(--tg-hint);
    padding: 7px 11px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .card .actions button:active { background: var(--glass-strong); }
  .card .actions button.done { color: var(--ok); }
  .card .actions button.danger { color: var(--danger); }

  .fab { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%); background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--tg-button-text); font-weight: 700; border: 0; padding: 16px 38px; border-radius: 30px;
    font-size: 15px; cursor: pointer; z-index: 20; box-shadow: 0 12px 32px rgba(52,183,161,.35); }

  /* Views */
  .view { display: none; flex-direction: column; min-height: 100vh; }
  .view.show { display: flex; }
  .view-head { padding: 8px 16px 10px; }
  .view-head h2 { margin: 6px 0 20px; font-size: 24px; font-weight: 800; }
  .view-body { flex: 1; padding: 0 16px calc(30px + env(safe-area-inset-bottom, 0px)); }
  .form-bottom { position: sticky; bottom: 0; background: rgba(14,15,19,.55);
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 12px 16px; display: flex; gap: 10px; border-top: 1px solid var(--glass-border); }
  .form-bottom button { flex: 1; border: 0; padding: 15px; border-radius: 15px; font-size: 15px;
    font-weight: 700; cursor: pointer; }
  .form-bottom .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--tg-button-text); }
  .form-bottom .ghost { background: var(--glass); color: var(--tg-text); flex: 0 0 32%; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--tg-hint); margin-bottom: 7px; font-weight: 600; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--glass); color: var(--tg-text);
    border: 1px solid var(--glass-border); border-radius: 14px; padding: 13px 15px; font-size: 15px;
    font-family: inherit; resize: vertical; transition: border-color .15s ease; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent-2); }
  .field textarea { min-height: 84px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .section-title { font-size: 12.5px; color: var(--accent); margin: 22px 0 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .6px; }

  /* Tags */
  .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip-add { background: transparent; border: 1px dashed var(--glass-border); color: var(--tg-hint);
    border-radius: 10px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; }
  .chip { background: var(--glass-strong); border-radius: 10px; padding: 7px 13px; font-size: 12.5px;
    font-weight: 600; color: var(--tg-text); display: flex; gap: 7px; align-items: center; }
  .chip .x { cursor: pointer; color: var(--tg-hint); }
  #tag-input, #c-tag-input { display: none; flex: 1; min-width: 130px; }

  /* Schedule rows in form */
  .sched-item { display: flex; align-items: center; justify-content: space-between;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 9px; }
  .sched-item .label { font-size: 13.5px; }
  .sched-item .label .sub { color: var(--tg-hint); font-size: 12px; margin-top: 2px; }
  .sched-item .actions { display: flex; gap: 6px; }
  .sched-item .icon-btn { font-size: 16px; padding: 6px; }

  .add-sched { background: transparent; border: 1px dashed var(--glass-border); color: var(--tg-hint);
    border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; }

  /* Settings tiles */
  .settings-list { display: flex; flex-direction: column; gap: 14px; }
  .setting-tile { background: var(--glass); backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--glass-border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .setting-tile .setting-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .setting-emoji { width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(138,77,255,.30), rgba(74,108,247,.30));
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .setting-name { font-size: 16px; font-weight: 700; }
  .setting-desc { font-size: 12.5px; color: var(--tg-hint); margin-top: 2px; }
  /* iOS toggle */
  .switch { position: relative; display: inline-block; width: 54px; height: 32px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 32px;
    transition: .2s; }
  .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(22px); }

  .snooze-dur-row { display: flex; gap: 10px; }
  .snooze-dur-row .field { flex: 1; }
  .snooze-dur-row .field input { text-align: center; }

  /* Card snooze expansion */
  .card .actions .snooze-opts { display: none; gap: 6px; }
  .card.snooze-open .actions .snooze-opts { display: flex; }
  .card.snooze-open .actions .snooze-toggle { display: none; }
  .snooze-opts .snooze-opt { background: var(--glass-strong); color: var(--tg-text);
    border: 1px solid var(--glass-border); border-radius: 9px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; transition: background .15s ease; }
  .snooze-opts .snooze-opt:active { background: var(--glass); }

  /* Modals (bottom sheets) */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30;
    display: none; align-items: flex-end; justify-content: center; }
  .modal-backdrop.show { display: flex; }
  .modal { background: rgba(24,26,33,.8); backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%); width: 100%; max-width: 560px; max-height: 88vh;
    overflow-y: auto; border-radius: 24px 24px 0 0; border-top: 1px solid var(--glass-border);
    padding: 12px 18px calc(26px + env(safe-area-inset-bottom, 0px));
    animation: slideup .22s ease; }
  @keyframes slideup { from { transform: translateY(40px); opacity: .3; } }
  .grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--tg-hint);
    opacity: .4; margin: 0 auto 14px; }
  .modal h3 { margin: 4px 0 18px; font-size: 19px; font-weight: 800; }

  .option { display: flex; justify-content: space-between; align-items: center;
    padding: 15px 12px; border-radius: 14px; cursor: pointer; transition: background .15s ease; }
  .option:active { background: var(--glass-strong); }
  .option .t { font-size: 15px; font-weight: 700; }
  .option .s { font-size: 12px; color: var(--tg-hint); margin-top: 2px; }
  .option .chev { color: var(--tg-hint); font-size: 22px; }

  .pill-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill { background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--tg-hint);
    cursor: pointer; user-select: none; }
  .pill.active { background: var(--accent); color: var(--tg-button-text); border-color: var(--accent); }

  .modal-foot { display: flex; gap: 10px; margin-top: 18px; }
  .modal-foot button { flex: 1; border: 0; padding: 15px; border-radius: 15px; font-size: 15px;
    font-weight: 700; cursor: pointer; }
  .modal-foot .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--tg-button-text); }
  .modal-foot .ghost { background: var(--glass); color: var(--tg-text); flex: 0 0 32%; }

  .img-tile { border: 1.5px dashed var(--glass-border); border-radius: 14px; padding: 20px;
    text-align: center; color: var(--tg-hint); font-size: 13px; cursor: pointer; }
  .img-preview { position: relative; margin-top: 10px; display: none; }
  .img-preview img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 14px; display: block; }
  .img-preview .rm { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6);
    color: #fff; border: 0; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; }
  .img-error { color: var(--danger); font-size: 12px; margin-top: 6px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: 90px;
    background: rgba(24,26,33,.9); backdrop-filter: blur(18px); color: var(--tg-text);
    padding: 12px 20px; border-radius: 14px; font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    max-width: 86%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-left: 3px solid var(--danger); }
</style>
</head>
<body>
<div id="app">
  <!-- List view -->
  <div class="view show" id="list-view">
    <header>
      <div class="brand"><div class="logo">R</div><h1>Randomly Remind Me</h1></div>
      <div class="hdr-actions">
        <button class="icon-btn" id="btn-settings" title="Settings">&#9881;&#65039;</button>
        <button class="icon-btn" id="btn-close" title="Close">&#10005;</button>
      </div>
    </header>
    <main id="main"></main>
    <button class="fab" id="fab-create">+ Create</button>
  </div>

  <!-- Form view (create / edit) -->
  <div class="view" id="form-view">
    <header>
      <div class="brand"><button class="icon-btn" id="btn-back">&#8592;</button><h1 id="form-head-title">Create Reminder</h1></div>
      <div class="hdr-actions">
        <button class="icon-btn" id="btn-close-form">&#10005;</button>
      </div>
    </header>
    <div class="view-body">
      <div class="seg" id="mode-row" style="margin:6px 0 18px;">
        <button class="active" data-mode="regular">Regular</button>
        <button data-mode="countdown">&#9203; Countdown</button>
      </div>

      <div id="regular-fields">
        <div class="field">
          <label>Reminder text</label>
          <textarea id="f-text" placeholder="Enter reminder text"></textarea>
        </div>
        <div class="field">
          <label>Timezone</label>
          <select id="f-tz"></select>
        </div>
        <div class="field">
          <label>Tags</label>
          <div class="tags-wrap" id="tag-wrap">
            <button class="chip-add" data-add>+ Add tag</button>
            <input id="tag-input" placeholder="Type a tag and press Enter"/>
          </div>
        </div>
        <div class="section-title">Schedules</div>
        <div id="schedule-list"></div>
        <button class="add-sched" id="add-schedule">+ Add Schedule</button>
      </div>

      <div id="countdown-fields" style="display:none;">
        <div class="field">
          <label>Reminder text</label>
          <textarea id="c-text" placeholder="Enter reminder text"></textarea>
        </div>
        <div class="field">
          <label>Timezone</label>
          <select id="c-tz"></select>
        </div>
        <div class="field">
          <label>Tags</label>
          <div class="tags-wrap" id="c-tag-wrap">
            <button class="chip-add" data-add>+ Add tag</button>
            <input id="c-tag-input" placeholder="Type a tag and press Enter"/>
          </div>
        </div>
        <div class="field">
          <label>Target date</label>
          <input id="c-date" type="date"/>
        </div>
        <div class="field">
          <label>Notification time</label>
          <input id="c-time" type="time"/>
        </div>
        <div class="field">
          <label>Days before target to start</label>
          <input id="c-days" type="number" min="0" placeholder="e.g. 3"/>
        </div>
      </div>

      <div class="field">
        <label>Note (optional)</label>
        <input id="f-note" placeholder="Optional note"/>
      </div>
      <div class="field">
        <label>Custom message template (optional)</label>
        <input id="f-template" placeholder="e.g. Time to {text}! (next in {next})"/>
      </div>
      <div class="field">
        <label>Image (optional)</label>
        <div class="img-tile" id="img-tile">&#128247; Tap to upload an image<br/><span style="font-size:11px">JPEG, PNG or WebP, up to 5 MB</span></div>
        <input type="file" id="f-image-file" accept="image/jpeg,image/png,image/webp" style="display:none"/>
        <div class="img-preview" id="img-preview">
          <img id="img-preview-img" alt="Attachment preview"/>
          <button class="rm" id="img-remove" title="Remove">&#10005;</button>
        </div>
        <div class="img-error" id="img-error"></div>
      </div>
    </div>
    <div class="form-bottom">
      <button class="ghost" id="btn-cancel-form">Cancel</button>
      <button class="primary" id="btn-save">Save</button>
    </div>
  </div>

  <!-- Settings view -->
  <div class="view" id="settings-view">
    <header>
      <div class="brand"><button class="icon-btn" id="btn-back-settings">&#8592;</button><h1>Settings</h1></div>
      <div class="hdr-actions"><button class="icon-btn" id="btn-close-settings">&#10005;</button></div>
    </header>
    <div class="view-body">
      <div class="settings-list">
        <div class="setting-tile">
          <div class="setting-top">
            <div class="setting-emoji">&#127757;</div>
            <div><div class="setting-name">Timezone</div><div class="setting-desc">Times shown in your region</div></div>
          </div>
          <select id="s-tz"></select>
        </div>
        <div class="setting-tile">
          <div class="setting-top">
            <div class="setting-emoji">&#128276;</div>
            <div><div class="setting-name">Snooze durations</div><div class="setting-desc">Options shown when you tap Snooze (minutes)</div></div>
          </div>
          <div class="snooze-dur-row">
            <div class="field"><label>1st</label><input id="sd1" type="number" min="1" placeholder="5"/></div>
            <div class="field"><label>2nd</label><input id="sd2" type="number" min="1" placeholder="10"/></div>
            <div class="field"><label>3rd</label><input id="sd3" type="number" min="1" placeholder="30"/></div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-bottom">
      <button class="primary" id="btn-save-settings">Save</button>
    </div>
  </div>

  <!-- Schedule type picker sheet -->
  <div class="modal-backdrop" id="sched-picker-backdrop">
    <div class="modal">
      <div class="grabber"></div>
      <h3>Add Schedule</h3>
      <div id="sched-options"></div>
      <div class="modal-foot"><button class="ghost" id="btn-close-sched">Cancel</button></div>
    </div>
  </div>

  <!-- Schedule editor sheet -->
  <div class="modal-backdrop" id="sched-editor-backdrop">
    <div class="modal">
      <div class="grabber"></div>
      <h3 id="sched-editor-title">Schedule</h3>
      <div class="seg" id="sched-type-row" style="margin-bottom:16px;">
        <button class="active" data-type="once">One time</button>
        <button data-type="interval">Interval</button>
        <button data-type="complex">Complex</button>
      </div>
      <div id="sched-editor-fields"></div>
      <div class="modal-foot">
