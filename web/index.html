<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Skeddy</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #1a1c23;
    --panel-2: #23262f;
    --text: #e8e9ec;
    --muted: #8a8d97;
    --accent: #34b7a1;
    --accent-2: #4f8cff;
    --danger: #ff5d5d;
    --ok: #34c759;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .icon-btn { background: transparent; border: 0; color: var(--muted); font-size: 20px; padding: 6px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .tabs {
    display: flex; background: var(--panel-2); border-radius: 10px; padding: 4px;
    margin-bottom: 16px; gap: 4px;
  }
  .tabs button {
    flex: 1; background: transparent; border: 0; color: var(--muted);
    padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .tabs button.active { background: #2d3040; color: var(--text); }
  .empty {
    background: var(--panel); border-radius: 10px; padding: 16px; color: var(--muted);
    font-size: 14px; text-align: center; margin: 24px 0;
  }
  .card {
    background: var(--panel); border-radius: 12px; padding: 14px;
    margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .title { font-size: 15px; font-weight: 500; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .card button { background: var(--panel-2); border: 0; color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .card button.danger { color: var(--danger); }
  .card button.primary { background: var(--accent); color: #06281f; font-weight: 600; }
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #06281f; font-weight: 600;
    border: 0; padding: 14px 28px; border-radius: 24px; font-size: 15px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(52, 183, 161, 0.35);
  }
  /* form */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid #2d3040; border-radius: 8px; padding: 10px; font-size: 14px;
    font-family: inherit; resize: vertical;
  }
  .field textarea { min-height: 72px; }
  .section-title { font-size: 13px; color: var(--accent-2); margin: 18px 0 8px; font-weight: 600; }
  .schedule-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2); border-radius: 8px; padding: 12px; margin-bottom: 8px;
  }
  .schedule-row .label { font-size: 14px; font-weight: 500; }
  .schedule-row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--muted); }
  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    background: var(--panel-2); border: 1px solid #2d3040; color: var(--text);
    padding: 6px 10px; border-radius: 16px; font-size: 12px; cursor: pointer;
  }
  .pill.active { background: var(--accent); color: #06281f; border-color: var(--accent); font-weight: 600; }
  .kind-row { display: flex; flex-direction: column; gap: 6px; }
  .kind-row label { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); padding: 10px; border-radius: 8px; cursor: pointer; }
  .kind-row input { margin-top: 3px; }
  .kind-row .t { font-size: 14px; font-weight: 500; }
  .kind-row .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .save-bar {
    position: sticky; bottom: 0; background: var(--bg); padding: 12px 16px 20px;
    display: flex; gap: 8px;
  }
  .save-bar button {
    flex: 1; padding: 14px; border-radius: 12px; border: 0; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .save-bar .primary { background: var(--accent); color: #06281f; }
  .save-bar .ghost { background: var(--panel-2); color: var(--text); }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); color: white; }
  .toast.ok { background: var(--ok); color: white; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px; width: 90%; max-width: 420px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .option { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--panel-2); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .modal .option.active { outline: 2px solid var(--accent); }
  .hidden { display: none !important; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { width: 18px; height: 18px; }
</style>
</head>
<body>
  <header>
    <h1>Skeddy</h1>
    <div style="display:flex; gap:4px;">
      <button class="icon-btn" id="btn-settings" title="Settings">&#8942;</button>
      <button class="icon-btn" id="btn-close" title="Close">&#10005;</button>
    </div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab-create">+ Create</button>

  <!-- Create / Edit form -->
  <div class="modal-backdrop" id="form-backdrop">
    <div class="modal" id="form-modal">
      <h3 id="form-title">New reminder</h3>
      <div class="field">
        <label>What do you want to be reminded about?</label>
        <textarea id="f-text" placeholder="e.g. stretch my legs"></textarea>
      </div>

      <div class="section-title">Main Settings</div>
      <div id="schedule-list">
        <!-- schedules added here -->
      </div>
      <div class="schedule-row" id="add-schedule-row" style="justify-content:flex-start; gap:8px;">
        <span style="color:var(--accent-2); font-weight:600;">+</span>
        <span>Add a schedule</span>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>Type</label>
        <div class="kind-row" id="kind-row">
          <label><input type="radio" name="kind" value="reminder"/> <div><div class="t">Reminder</div><div class="s">I send it and complete it for you</div></div></label>
          <label><input type="radio" name="kind" value="task" checked/> <div><div class="t">Task</div><div class="s">I send it and it waits for you to complete it</div></div></label>
          <label><input type="radio" name="kind" value="task_no_notify"/> <div><div class="t">Task with no notifications</div><div class="s">I don't send it; it waits for you to complete it</div></div></label>
        </div>
      </div>

      <div class="field">
        <label>Note (optional)</label>
        <input id="f-note" placeholder="Optional note"/>
      </div>

      <div class="field">
        <label>Custom message template (optional)</label>
        <input id="f-template" placeholder="e.g. Time to {text}! (next in {next})"/>
      </div>

      <div class="field">
        <label>Image (optional, Telegram photo URL or file_id)</label>
        <input id="f-image" placeholder="https://... or file_id"/>
      </div>

      <div class="save-bar">
        <button class="ghost" id="btn-cancel-form">Cancel</button>
        <button class="primary" id="btn-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-backdrop" id="settings-backdrop">
    <div class="modal" id="settings-modal">
      <h3>Settings</h3>
      <div class="field">
        <label>Timezone (IANA)</label>
        <input id="s-tz" placeholder="e.g. Europe/Amsterdam"/>
      </div>
      <div class="field">
        <label class="switch"><input type="checkbox" id="s-snooze"/> Hide snooze buttons</label>
      </div>
      <div class="save-bar">
        <button class="ghost" id="btn-close-settings">Close</button>
        <button class="primary" id="btn-save-settings">Save</button>
      </div>
    </div>
  </div>

  <!-- Schedule picker modal -->
  <div class="modal-backdrop" id="sched-picker-backdrop">
    <div class="modal">
      <h3>Pick a schedule</h3>
      <div id="sched-options"></div>
      <div class="save-bar">
        <button class="ghost" id="btn-close-sched">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
  <script src="app.debug.js"></script>
</body>
</html>
